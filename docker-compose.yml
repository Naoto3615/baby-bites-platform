services:
  postgres:
    image: postgres:16
    container_name: baby_bites_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: baby_bites
    ports:
      - "5432:5432"
    volumes:
      - baby_bites_pg:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: baby_bites_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - baby_bites_redis:/data

volumes:
  baby_bites_pg:
  baby_bites_redis:
